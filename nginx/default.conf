# 마리에 무중단 배포용 최소 리버스 프록시.
#
# 역할은 딱 하나 — 3046 을 계속 점유한 채 blue/green 사이를 갈아끼우는 것.
# 캐시·rate limit·real_ip 같은 부가 기능은 의도적으로 넣지 않는다. nginx 를
# 끼우면서 앱이 보는 요청이 조금이라도 달라지면 그 자체가 회귀다.

# 도커 내장 DNS. upstream 블록을 쓰면 nginx 가 "설정 로드 시점"에 대상 이름을
# 해석하는데, 그러면 (a) 재부팅 후 nginx 가 앱보다 먼저 뜰 때 (b) 대기 색이
# 꺼져 있을 때 nginx 자체가 기동 실패한다. 변수로 proxy_pass 하면 요청 시점에
# 해석하므로 대상이 잠깐 없어도 nginx 는 살아서 502 만 낸다(복구 가능).
resolver 127.0.0.11 ipv6=off valid=10s;

# 실제 업그레이드 요청일 때만 Connection: upgrade. 무조건 붙이면 일반 요청의
# keepalive 가 깨진다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 이력서 PDF 첨부가 10MB + 멀티파트 오버헤드. nginx 가 없던 시절엔 이런
    # 상한 자체가 없었으므로 넉넉히 잡는다. 실제 크기 제한은 각 API 라우트가
    # 자체적으로 강제한다(413 응답 포함).
    client_max_body_size 20m;

    # 첨부 업로드 라우트의 자체 타임아웃이 60s. 그보다 먼저 nginx 가 끊으면
    # 앱이 만든 친절한 에러 대신 502 가 나간다.
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location / {
        # 활성 색을 가리키는 유일한 지점. webhook-deploy.sh 가 이 파일을 다시 써서
        # nginx -s reload 로 반영한다. ($upstream_target 이 여기서 정의된다)
        # 확장자가 .inc 인 이유: conf.d/*.conf 자동 include 에 걸려 중복 정의되면 안 됨.
        include /etc/nginx/conf.d/upstream.inc;
        proxy_pass $upstream_target;
        proxy_http_version 1.1;

        # Host 계열은 앱이 origin 검증에 쓰므로 원본 유지.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;

        # 주의: X-Real-IP 를 설정하지 않는다.
        # unlock/route.ts 는 IP 를 x-real-ip → cf-connecting-ip → x-forwarded-for
        # 순으로 읽는다. 컨테이너 nginx 의 $remote_addr 는 도커 게이트웨이 IP라
        # 모든 사용자가 같은 값이 되고, 그러면 관리자·가입 IP 제한이 전역 공용이
        # 되어 한 명의 실패가 전체를 차단한다. cloudflared 가 붙여 보낸
        # CF-Connecting-IP / X-Forwarded-For 를 그대로 흘려보내면 앱은 nginx
        # 도입 전과 동일하게 진짜 IP 를 읽는다.

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
    }
}
