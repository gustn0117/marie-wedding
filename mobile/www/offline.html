<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>마리에</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        color: #13161d;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      }
      main {
        box-sizing: border-box;
        display: flex;
        min-height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        text-align: center;
      }
      svg {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 24px 0 0;
        font-size: 20px;
        letter-spacing: -0.03em;
      }
      p {
        margin: 8px 0 0;
        font-size: 15px;
        line-height: 1.6;
        color: #5b6170;
      }
      button {
        margin-top: 28px;
        min-height: 50px;
        width: 100%;
        max-width: 280px;
        border: 0;
        border-radius: 10px;
        background: #051049;
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <!-- 사이트를 열지 못했을 때 앱이 보이는 화면. 다시 시도하면 사이트를 다시 연다. -->
    <main>
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M8 22.4V10.2L16 18l8-7.8v12.2" stroke="#051049" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M16 18v4.4" stroke="#F2C879" stroke-width="2.7" stroke-linecap="round" />
        <circle cx="23.2" cy="7.8" r="1.7" fill="#F2C879" />
      </svg>
      <h1>인터넷에 연결할 수 없습니다</h1>
      <p>연결 상태를 확인한 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="location.replace('https://marie.co.kr/')">다시 시도</button>
    </main>
  </body>
</html>
