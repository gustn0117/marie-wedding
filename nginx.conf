upstream nextjs {
    server web:3000;
}

# cloudflared가 같은 호스트에서 접속할 때만 Cloudflare의 실제 클라이언트 IP
# 헤더를 신뢰한다. 외부에서 직접 보낸 CF-Connecting-IP 위조값은 무시된다.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# 원래 TCP peer가 로컬 터널인 경우에만 전달받은 scheme을 사용한다.
# 그 밖의 직접 요청은 nginx가 실제로 받은 scheme으로 덮어쓴다.
map $realip_remote_addr $is_local_tunnel {
    default   0;
    127.0.0.1 1;
    ::1       1;
}

map "$is_local_tunnel:$http_x_forwarded_proto" $external_proto {
    default   $scheme;
    "1:http"  http;
    "1:https" https;
}

# 관리자 잠금 해제 brute-force 방어. IP zone은 nginx worker 전체에서 공유된다.
limit_req_zone $binary_remote_addr zone=admin_unlock_ip:10m rate=3r/m;

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    location = /api/admin/unlock {
        limit_req zone=admin_unlock_ip burst=2 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_proto;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_proto;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Static files caching
    location /_next/static {
        proxy_pass http://nextjs;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    location /public {
        proxy_pass http://nextjs;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=86400";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;
}

